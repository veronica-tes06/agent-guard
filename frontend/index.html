<!doctype html>
<!--
  The single HTML page of the app. Vite serves it at http://localhost:5173/.
  React fills the empty "root" div; all visible content comes from src/App.jsx.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page scale properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentGuard</title>
  </head>
  <body>
    <!-- Empty container that React renders the app into -->
    <div id="root"></div>
    <!-- Entry point. type="module" allows import/export; Vite converts the JSX on the fly -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
